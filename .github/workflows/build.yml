
name: Build DR TV APK with Server Test

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get files
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v4

      - name: Install SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Extract original app
        run: unzip -q DRTV.zip

      - name: Add server test and fix compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('DRTV_SkyStyle_FireStick')
          gradle=root/'app/build.gradle'
          code=gradle.read_text().replace('compileSdk 35','compileSdk 36').replace('versionCode 3','versionCode 4').replace("versionName '3.0'","versionName '3.2'")
          gradle.write_text(code)
          project=root/'build.gradle'
          project.write_text(project.read_text().replace('8.9.2','8.10.1'))
          api=root/'app/src/main/java/com/drtv/glass/api/XtreamClient.java'
          s=api.read_text()
          s=s.replace('import java.net.URL;', 'import java.net.URL;\nimport java.net.Socket;\nimport java.net.InetSocketAddress;\nimport java.net.UnknownHostException;\nimport java.net.ConnectException;\nimport java.net.SocketTimeoutException;')
          key='    public static void login(String dns, String user, String pass, Callback<String> callback) {'
          assert key in s, 'Xtream API source differs from expected version'
          s=s.replace(key,'''    // Tests TCP connection without sending credentials.
              public static void testServer(String dns, Callback<String> callback) {
                  IO.execute(() -> {
                      try {
                          URL url = new URL(normalizeHost(dns));
                          int port = url.getPort() > 0 ? url.getPort() :
                              ("https".equalsIgnoreCase(url.getProtocol()) ? 443 : 80);
                          try (Socket sock = new Socket()) {
                              sock.connect(new InetSocketAddress(url.getHost(), port), 6500);
                          }
                          dispatch(callback, "Server reachable on port " + port + ". Now try Sign in.", null);
                      } catch (UnknownHostException e) {
                          dispatch(callback, null, "Server name not found. Check the URL spelling.");
                      } catch (SocketTimeoutException e) {
                          dispatch(callback, null, "Connection timed out. Check the exact port in your working app.");
                      } catch (ConnectException e) {
                          dispatch(callback, null, "Port refused connection. Check the port in your working app.");
                      } catch (Exception e) {
                          dispatch(callback, null, "Connection test failed. Check the server URL.");
                      }
                  });
              }
          ''' + key,1)
          api.write_text(s)
          login=root/'app/src/main/java/com/drtv/glass/ui/LoginActivity.java'
          s=login.read_text()
          s=s.replace('private Button login;', 'private Button login,test;')
          s=s.replace('panel.addView(status,U.lp(-1,25,this));','panel.addView(status,U.lp(-1,65,this));')
          old='login=U.button(this,"Sign in  →",this::authenticate);panel.addView(login,U.lp(250,48,this));'
          new='''test=U.button(this,"Test server",this::checkServer);
              panel.addView(test,U.lp(250,48,this));
              login=U.button(this,"Sign in  →",this::authenticate);
              panel.addView(login,U.lp(250,48,this));'''
          assert old in s, 'Login UI source differs from expected version'
          s=s.replace(old,new,1)
          key='    private void authenticate() {'
          assert key in s
          s=s.replace(key,'''    private void checkServer() {
                  String address=dns.getText().toString().trim();
                  if (address.isEmpty()) { status.setText("Enter server URL first."); return; }
                  test.setEnabled(false);
                  status.setText("Checking the address and port without your password…");
                  XtreamClient.testServer(address,(message,error)->{
                      if (isFinishing() || isDestroyed()) return;
                      test.setEnabled(true);
                      status.setText(error!=null ? error : message);
                  });
              }
          '''+key,1)
          login.write_text(s)
          PY

      - name: Build APK
        working-directory: DRTV_SkyStyle_FireStick
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: DR-TV-Server-Test-APK
          path: DRTV_SkyStyle_FireStick/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
